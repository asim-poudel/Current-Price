services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: currentprice
      POSTGRES_USER: currentprice
      POSTGRES_PASSWORD: currentprice_dev
    ports:
      - "5432:5432"
    volumes:
      - currentprice_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currentprice -d currentprice"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  currentprice_postgres:
